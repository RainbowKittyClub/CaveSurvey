org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
minecraft_version=26.3
fabric_loader_version=0.19.5
fabric_version=0.162.0+26.3
loom_version=1.17.19
shadow_version=9.6.1
polymer_version=0.18.4+26.3
server_translations_version=3.2.0+26.3

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25

# --- Dev server ----------------------------------------------------------------------------------
# Present dev_server_ports turns on gradle/devserver.gradle: the seeded run/ world, the rcon setup
# devserver.sh needs, and the Quilt smoke-test run. Delete this section for Loom's bare dev server.
# Every run takes the first two free ports in this block (server, then rcon) and writes them into
# run/server.properties. Keep it clear of 25565–25567, which Docker publishes.
dev_server_ports=25600-25800
dev_rcon_password=dev
# Datapack pack_format for the seeded dev-defaults pack. 121 = MC 26.3; bump with minecraft_version.
dev_datapack_pack_format=121
# Data version stamped into the seeded options.txt. 5023 = MC 26.3; bump alongside.
dev_client_options_version=5023
# Name the dev client joins under. Present, it skips the offline-mode name prompt and is opped in
# the seeded run/ops.json; delete it to be prompted and join as whoever you type.
dev_client_username=TestPlayer

# Quilt Loader, for the optional `runQuiltServer` task only (see gradle/devserver.gradle / README).
quilt_loader_version=0.31.0-beta.4
quilt_sponge_mixin_version=0.17.4+mixin.0.8.7
quilt_json5_version=1.0.4+final
quilt_config_version=1.3.3
quilt_asm_version=9.10.1
quilt_mixinextras_version=0.5.5


# Mod Properties
mod_version = 1.2.0
mod_name = Cave Survey
mod_description = Advanced cave maps based on 3D path-finding
mod_authors = ["Mehrad Nayyeri"]
mod_website = https://github.com/RainbowKittyClub/CaveSurvey
mod_issues = https://github.com/RainbowKittyClub/CaveSurvey/issues
mod_license = LGPL-3.0-or-later


# Project Properties
maven_group = ir.mehradn
mod_id = cave-survey
entrypoint = ir.mehradn.cavesurvey.CaveSurvey
